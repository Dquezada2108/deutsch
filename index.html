<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Quiz Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#ECEFF4;--surface:#FFFFFF;--rule:#D3DAE6;--ink:#18202E;--muted:#596476;--accent:#2340C8;--redline:#D9363E;--shadow:rgba(24,32,60,.28);
  --display:"Archivo","Arial Narrow",Arial,sans-serif;--body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151C;--surface:#1A2029;--rule:#2C3544;--ink:#E6EAF1;--muted:#9BA6B7;--accent:#93A6FF;--redline:#E2555C;--shadow:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151C;--surface:#1A2029;--rule:#2C3544;--ink:#E6EAF1;--muted:#9BA6B7;--accent:#93A6FF;--redline:#E2555C;--shadow:rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 56px;display:grid;gap:24px}
.kicker{font-family:var(--display);font-stretch:95%;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(32px,8vw,52px);font-weight:800;font-stretch:72%;line-height:.98;margin:4px 0 0}
h1 span{color:var(--accent)}
.list{display:grid;gap:12px}
a.quiz{display:grid;gap:4px;text-decoration:none;color:inherit;background:var(--surface);border-radius:6px;padding:16px 20px;border-top:3px solid var(--redline);box-shadow:0 1px 0 var(--rule),0 14px 30px -20px var(--shadow)}
a.quiz:hover h2{color:var(--accent)}
a.quiz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:24px;margin:0}
a.quiz p{margin:0;color:var(--muted);font-size:15px}
.new{font-family:var(--display);font-size:12px;font-weight:700;color:var(--accent);margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Momente B1</div>
    <h1>Deutsch <span>Quiz</span> Trainer</h1>
  </header>
  <div class="list">
    <a class="quiz" href="quiz4/">
      <div class="kicker">Seite 43 · Welcher Ort ist dein Highlight?</div>
      <h2>Quiz 4<span class="new">NEU</span></h2>
      <p>damit / um … zu · wenn + Konjunktiv II · Adjektivsteigerung · Vokabeln · Probetest</p>
    </a>
    <a class="quiz" href="quiz3/">
      <div class="kicker">Lektion 4 · Morgen, morgen</div>
      <h2>Quiz 3</h2>
      <p>Adjektive · Konnektoren · damit / um … zu · Vokabeln S. 26–27 · Probetest</p>
    </a>
  </div>
</div>
</body>
</html>
